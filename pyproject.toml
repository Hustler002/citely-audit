[project]
name = "citely-audit"
version = "0.1.0"
description = "Agent Skill Marketplace auditing website AI-discoverability and on-site engagement."
# 3.11 and 3.12 only, and the UPPER bound is the load-bearing half. It was ">=3.11", which promised
# a working install on interpreters where the pins cannot resolve. Checked with
# `pip download --only-binary=:all:` rather than by attempting an install and reading the wreckage:
#
#     python   lxml==5.3.0   greenlet==3.0.3 (via playwright)
#     3.11     wheel         wheel
#     3.12     wheel         wheel
#     3.13     wheel         NONE
#     3.14     NONE          NONE
#
# Without the bound, a reviewer on 3.13 — the current stable release — silently falls back to a
# source build of greenlet, which needs a C toolchain and fails on a clean Windows machine. With it,
# pip refuses up front and says why. The pins are not relaxed instead: they are what make the
# recorded scores reproducible.
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }

# Pinned for reproducibility. Playwright is required only for Tier-A rendering
# (see the tiered rendering strategy); the audit degrades gracefully without it.
dependencies = [
    "requests==2.32.3",
    "beautifulsoup4==4.12.3",
    "lxml==5.3.0",
    "jsonschema==4.23.0",
    "playwright==1.47.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    # The agentskills.io reference validator, exposed as the `agentskills` command. The brief calls
    # it "a convenience, not required", but skill-format compliance is a scored criterion, so it is
    # pinned here to make it run in CI rather than depend on someone remembering. Its rules are ALSO
    # asserted natively in tests/test_compliance.py, so the guarantee survives the tool changing.
    "skills-ref==0.1.1",
]

# This project intentionally ships NO importable Python package. Every skill is a
# self-contained agentskills.io folder whose scripts are invoked by path (subprocess),
# never imported across skill boundaries. Declaring an empty package list stops
# setuptools auto-discovery from failing on the top-level config/ skills/ tests/ dirs,
# so `pip install -e .` resolves dependencies only.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: exercises a real browser render (needs provisioned Chromium)",
]

# NOTE: After `pip install -e .` (or installing the pinned deps), the Chromium
# binary must be provisioned ONCE as a setup step — it is intentionally NOT
# downloaded inside the timed audit run:
#     python -m playwright install chromium
